<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Гаджеты — зависимость или необходимость?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4ff;
            --text: #1a1a2e;
            --card-bg: rgba(255,255,255,0.97);
            --card-border: rgba(100,150,255,0.2);
            --accent: #4d7cff;
            --muted: #6b7280;
            --navbar-bg: rgba(255,255,255,0.95);
            --toast-bg: #333;
            --toast-text: #fff;
            --transition: all 0.8s ease;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #e2e8f0;
            --card-bg: rgba(30,41,59,0.92);
            --card-border: rgba(100,150,255,0.3);
            --accent: #60a5fa;
            --muted: #94a3b8;
            --navbar-bg: rgba(15,23,42,0.95);
            --toast-bg: #444;
            --toast-text: #e2e8f0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            transition: var(--transition);
            padding-top: 70px;
        }

        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: var(--transition);
        }

        .quiz-card, .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            transition: var(--transition);
            padding: 1.5rem;
        }

        /* Кастомные уведомления (toast) */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            max-width: 90%;
        }
        .custom-toast {
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .custom-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hover-эффект лупы */
        .form-check label, .list-group-item {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .form-check label:hover, .list-group-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(77,124,255,0.25);
        }

        .form-check { margin-bottom: 1.25rem; }
        .form-check input[type="radio"], .form-check input[type="checkbox"] { display: none; }
        .form-check label {
            display: block;
            padding: 1rem 1.5rem;
            border-radius: 999px;
            border: 2px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 1.05rem;
        }
        .form-check label:hover { background: rgba(77,124,255,0.08); border-color: var(--accent); }
        .form-check input:checked + label {
            border-color: var(--accent);
            background: rgba(77,124,255,0.12);
            box-shadow: 0 0 0 6px rgba(77,124,255,0.15);
        }

        .list-group-item {
            background: var(--card-bg);
            border-color: var(--card-border);
            color: var(--text);
            padding: 1.25rem 1.5rem;
        }
        .alert {
            border-radius: 14px;
            background: rgba(77,124,255,0.08);
            border-color: var(--accent);
            color: var(--text);
        }

        /* Адаптация под мобильные */
        @media (max-width: 576px) {
            body { padding-top: 60px; }
            .navbar { padding: 0.75rem 1rem; }
            .navbar h1 { font-size: 1.1rem; }
            .quiz-card, .result-card { padding: 1.25rem; margin: 0 0.75rem; }
            h3 { font-size: 1.25rem; }
            .form-check label { padding: 0.9rem 1.3rem; font-size: 1rem; }
            .btn { padding: 0.75rem 1.25rem; font-size: 1.05rem; }
            #toast-container { top: 70px; }
        }
    </style>
</head>
<body data-theme="light">
    <!-- Шапка -->
    <nav class="navbar fixed-top shadow-sm">
        <div class="container-fluid d-flex align-items-center">
            <div class="flex-grow-1"></div>
            <h1 onclick="resetTest()" class="h4 mb-0 text-center fw-bold" style="cursor:pointer;">
                Тест: Гаджеты — зависимость или необходимость?
            </h1>
            <div class="flex-grow-1 d-flex justify-content-end">
                <button id="themeToggle" class="btn btn-link text-decoration-none fs-3" aria-label="Сменить тему">☀️</button>
            </div>
        </div>
    </nav>

    <!-- Кастомные уведомления -->
    <div id="toast-container"></div>

    <div class="container pt-4">
        <div id="quiz" class="quiz-card card">
            <!-- Вопрос 1 -->
            <div class="question active" id="q1">
                <h3 class="mb-4">1. Сколько времени в день вы проводите за гаджетами?</h3>
                <div class="form-check"><input type="radio" name="q1" id="q1A" value="A"><label for="q1A">Менее 1 часа</label></div>
                <div class="form-check"><input type="radio" name="q1" id="q1B" value="B"><label for="q1B">1-2 часа</label></div>
                <div class="form-check"><input type="radio" name="q1" id="q1C" value="C"><label for="q1C">2-4 часа</label></div>
                <div class="form-check"><input type="radio" name="q1" id="q1D" value="D"><label for="q1D">4-6 часов</label></div>
                <div class="form-check"><input type="radio" name="q1" id="q1E" value="E"><label for="q1E">Более 6 часов</label></div>
            </div>

            <!-- Вопросы 2–5 (как в предыдущей версии) -->

            <button id="next" class="btn btn-primary w-100 mt-4 py-3 fw-bold fs-5">Далее →</button>
        </div>

        <div id="result" class="result-card mt-4" style="display:none;">
            <h2 class="text-center mb-4">Ваши результаты</h2>

            <div class="mb-4">
                <button class="btn btn-outline-primary w-100 py-3 fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#userAnswers">
                    ▼ Ваши ответы и пояснения
                </button>
                <div id="userAnswers" class="collapse mt-3">
                    <div id="answersList" class="list-group"></div>
                </div>
            </div>

            <div id="overall"></div>
            <div id="recommendations"></div>

            <button id="saveRecs" class="btn btn-success w-100 mt-4 py-3 fw-bold fs-5">
                Сохранить рекомендации
            </button>
        </div>
    </div>

    <!-- Модальное окно для сохранения -->
    <div class="modal fade" id="saveModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Сохранить рекомендации</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p>Выберите действие:</p>
                    <button type="button" class="btn btn-primary w-100 mb-3" id="copyToClipboard">Скопировать в буфер</button>
                    <button type="button" class="btn btn-success w-100" id="openInNotes">Открыть в Заметках (iOS)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Функция показа кастомного уведомления
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.textContent = message;
            container.appendChild(toast);

            // Показываем с анимацией
            setTimeout(() => toast.classList.add('show'), 10);

            // Убираем через 4 секунды
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        const questions = ['q1','q2','q3','q4','q5'];
        let current = 0;
        const answers = {};

        const explanations = {
            q1: { A:'Менее 1 часа — очень низкая нагрузка. Гаджеты — просто инструмент.', B:'1–2 часа — хороший баланс.', C:'2–4 часа — средний уровень. Ставь лимиты.', D:'4–6 часов — высокий уровень. Начинай сокращать.', E:'Более 6 часов — сильная зависимость. Срочно вводи перерывы.' },
            q2: { A:'Обучение — самый полезный сценарий.', B:'Связь — главное преимущество.', C:'Развлечения — самый рискованный вариант.', D:'Работа — оправданное использование.', E:'Смешанное использование — следи за балансом.' },
            q3: { A:'Нет последствий — отлично.', B:'Здоровье — используй правило 20-20-20 и фильтры.', C:'Учёба страдает — включай Pomodoro.', D:'Отношения ухудшаются — планируй встречи без телефонов.', E:'Сон и настроение — убирай гаджеты за час до сна.' },
            q4: { A:'Зависимости нет — идеально.', B:'Редко — начало привыкания. Ставь границы.', C:'Периодически — средняя зависимость.', D:'Часто — высокая зависимость.', E:'Постоянно — сильная зависимость.' },
            q5: { A:'Полностью необходимость — здоровое отношение.', B:'В основном необходимость — хороший баланс.', C:'Оба варианта — реалистичный взгляд.', D:'В основном зависимость — пора перестраивать привычки.', E:'Чистая зависимость — срочно меняй подход.' }
        };

        // Логика вопроса 3
        document.querySelectorAll('#q3 input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', function() {
                if (this.id === 'q3A') {
                    if (this.checked) {
                        document.querySelectorAll('#q3 input[type="checkbox"]:not(#q3A)').forEach(el => { el.checked = false; el.disabled = true; });
                    } else {
                        document.querySelectorAll('#q3 input[type="checkbox"]:not(#q3A)').forEach(el => el.disabled = false);
                    }
                } else if (this.checked) {
                    document.getElementById('q3A').checked = false;
                }
            });
        });

        document.getElementById('q1').classList.add('active');

        document.getElementById('next').addEventListener('click', () => {
            const q = questions[current];
            let selected = [];

            if (q === 'q2' || q === 'q3') {
                selected = Array.from(document.querySelectorAll(`#${q} input:checked`)).map(i => i.value);
            } else {
                const sel = document.querySelector(`#${q} input:checked`);
                if (!sel) {
                    let missed = [];
                    for (let i = 0; i <= current; i++) {
                        if (!answers[questions[i]]) missed.push(i + 1);
                    }
                    showToast(`Не отвечены вопросы: ${missed.join(', ')}`);
                    return;
                }
                selected = [sel.value];
            }

            if (selected.length === 0) {
                showToast(`Не отвечен вопрос ${current + 1}`);
                return;
            }

            answers[q] = q === 'q2' || q === 'q3' ? selected : selected[0];

            document.getElementById(q).classList.remove('active');
            current++;
            if (current < questions.length) {
                document.getElementById(questions[current]).classList.add('active');
            } else {
                showResults();
            }
        });

        function resetTest() {
            location.reload();
        }

        function showResults() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            let ansHTML = '';
            for (let q in answers) {
                const questionText = document.querySelector(`#${q} h3`).innerText.trim();
                let answerText = '';
                let explText = '';

                if (Array.isArray(answers[q])) {
                    answers[q].forEach(val => {
                        answerText += (answerText ? ', ' : '') + document.querySelector(`#${q}${val} + label`).textContent.trim();
                        explText += (explText ? ' + ' : '') + explanations[q][val];
                    });
                } else {
                    answerText = document.querySelector(`#${q}${answers[q]} + label`).textContent.trim();
                    explText = explanations[q][answers[q]];
                }

                ansHTML += `
                    <div class="list-group-item py-3">
                        <strong>${questionText}</strong><br>
                        ${answerText}: ${explText}
                    </div>`;
            }
            document.getElementById('answersList').innerHTML = ansHTML;

            // Подсчёт баллов
            function getPoints(v) {
                if (Array.isArray(v)) return Math.max(...v.map(val => ['A','B','C','D','E'].indexOf(val)));
                return ['A','B','C','D','E'].indexOf(v);
            }
            let score = getPoints(answers.q1) * 2 + getPoints(answers.q3) * 1.5 + getPoints(answers.q4) * 2 + getPoints(answers.q5) * 0.5;

            let levelIndex = score < 6 ? 0 : score < 10 ? 1 : score < 14 ? 2 : score < 18 ? 3 : 4;
            const levels = [
                'Очень низкая зависимость: Гаджеты для вас — чистая необходимость. Продолжайте в том же духе!',
                'Низкая зависимость: Вы хорошо контролируете время. Гаджеты — полезный инструмент.',
                'Умеренная зависимость: Баланс есть, но следите за здоровьем и продуктивностью.',
                'Высокая зависимость: Рекомендуется активно снижать время использования.',
                'Очень высокая зависимость: Зависимость серьёзная. Срочно меняйте привычки.'
            ];
            document.getElementById('overall').innerHTML = `<h3 class="mt-5">Общий вывод</h3><div class="alert alert-info fs-5 p-4">${levels[levelIndex]}</div>`;

            // Рекомендации
            let recs = [];
            const q1p = getPoints(answers.q1);
            const q4p = getPoints(answers.q4);
            const q5p = getPoints(answers.q5);

            if (q1p > 2) recs.push('Сократите общее время за гаджетами. Установите лимиты через встроенные функции телефона или приложения.');
            if (answers.q2 && answers.q2.includes('C')) recs.push('Ограничьте время на развлечения до 1 часа в день.');
            if (answers.q3 && answers.q3.includes('B')) recs.push('Следуйте правилу 20-20-20 и включите фильтр синего света.');
            if (answers.q3 && answers.q3.includes('C')) recs.push('Используйте Pomodoro и выключайте уведомления во время учёбы.');
            if (answers.q3 && answers.q3.includes('E')) recs.push('Убирайте гаджеты за час до сна.');
            if (q4p > 1) recs.push('Попробуйте цифровой детокс хотя бы 1 день в неделю.');
            if (q5p > 2) recs.push('Пересмотрите роль гаджетов в жизни — ставьте телефон на беззвучный чаще.');

            if (recs.length === 0) recs.push('Всё отлично! Ваш баланс использования гаджетов — здоровый.');

            let recHTML = '<h3 class="mt-5">Рекомендации</h3><ul class="list-group">';
            recs.forEach(r => recHTML += `<li class="list-group-item py-3">${r}</li>`);
            recHTML += '</ul>';
            document.getElementById('recommendations').innerHTML = recHTML;

            // Сохранение рекомендаций
            document.getElementById('saveRecs').addEventListener('click', () => {
                const recText = recs.map((r, i) => `${i+1}. ${r}`).join('\n\n');
                const fullText = `Рекомендации из теста "Гаджеты — зависимость или необходимость?"\n\n${recText}`;

                const modal = new bootstrap.Modal(document.getElementById('saveModal'));
                modal.show();

                document.getElementById('copyToClipboard').onclick = () => {
                    navigator.clipboard.writeText(fullText).then(() => {
                        showToast('Скопировано в буфер обмена!');
                        modal.hide();
                    });
                };

                document.getElementById('openInNotes').onclick = () => {
                    const encoded = encodeURIComponent(fullText);
                    window.location.href = `notes://new?text=${encoded}`;
                    modal.hide();
                };
            });
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const newTheme = document.body.dataset.theme === 'light' ? 'dark' : 'light';
            document.body.dataset.theme = newTheme;
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
